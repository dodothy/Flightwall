<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flight Wall">
<meta name="theme-color" content="#000000">
<title>Flight Wall</title>
<style>
  :root{
    --bg:#000;
    --bezel:#0b0b0d;
    --ui:#8a8a94;
    --ui-dim:#4a4a52;
    --ui-line:rgba(255,255,255,.10);
    --live:#3ddc84;
    --demo:#ffb021;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg)}
  body{
    color:#eee;
    font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  }

  /* ---------- the LED panel ---------- */
  .stage{width:min(100%, calc((100dvh - 120px) * 2), 1400px);position:relative}
  .wall{
    position:relative;width:100%;aspect-ratio:2/1;
    background:var(--bezel);
    border-radius:6px;
    box-shadow:0 0 0 1px #1a1a1f, 0 30px 80px rgba(0,0,0,.8);
    overflow:hidden;
    -webkit-box-reflect:below 6px linear-gradient(transparent 78%, rgba(255,255,255,.13));
    transition:filter .8s ease;
  }
  .wall canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #glow{filter:blur(var(--glow,6px)) saturate(1.3);opacity:.85;mix-blend-mode:screen}
  #lit{mix-blend-mode:screen}
  #radar{display:none;cursor:pointer}
  .wall.radar #radar{display:block}
  .wall.radar #bg,.wall.radar #glow,.wall.radar #lit{display:none}
  .seg{display:inline-flex;background:#111114;border:1px solid var(--ui-line);border-radius:999px;padding:3px}
  .seg .btn{border:0;background:none;padding:6px 14px;color:var(--ui)}
  .seg .btn.on{background:#fff;color:#000}

  /* ---------- status + controls ---------- */
  .bar{
    width:min(100%,1400px);margin-top:22px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    transition:opacity .5s ease;position:relative;z-index:2;
  }
  body.idle .bar{opacity:0;pointer-events:none}
  .status{display:flex;align-items:center;gap:8px;color:var(--ui);letter-spacing:.5px;margin-right:auto;min-width:0;background:#000;padding:6px 10px;border-radius:999px}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--ui-dim);flex:none}
  .status.live i{background:var(--live);box-shadow:0 0 8px var(--live)}
  .status.demo i{background:var(--demo);box-shadow:0 0 8px var(--demo)}
  .status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{
    background:#111114;border:1px solid var(--ui-line);color:#d6d6dc;
    font:inherit;letter-spacing:.5px;padding:9px 13px;border-radius:999px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:active{background:#1a1a1f}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .btn b{color:#fff;font-weight:700}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
  @media (max-width:640px){
    .status{width:100%;justify-content:center;margin-right:0}
  }
  .rotate{display:none;color:var(--ui-dim);margin-top:14px;letter-spacing:.5px}
  @media (orientation:portrait) and (max-width:600px){ .rotate{display:block} }

  /* ---------- location sheet ---------- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .sheet-bg.on{display:flex}
  .sheet{max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;width:min(480px,100%);background:#111114;border:1px solid var(--ui-line);border-bottom:0;border-radius:18px 18px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:15px;letter-spacing:1px;margin-bottom:4px;color:#fff}
  .sheet p{color:var(--ui);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .grid .btn{justify-content:center;border-radius:10px;padding:12px}
  .grid .btn.sel{border-color:#fff}
  .region{grid-column:1/-1;color:var(--ui);letter-spacing:1px;text-transform:uppercase;font-size:11px;margin-top:6px}
  .wide{width:100%;justify-content:center;border-radius:10px;padding:13px}
  .primary{background:#fff;color:#000;border-color:#fff}
  .primary:active{background:#ddd}
  .row{display:flex;gap:8px}
  .row .btn{flex:1;justify-content:center;border-radius:10px}
  .lbl{color:var(--ui);margin-top:6px}
  .field{width:100%;margin:8px 0 6px;padding:12px;border-radius:10px;border:1px solid var(--ui-line);background:#000;color:#fff;font:inherit;font-size:16px}
  .field:focus{outline:2px solid #fff;outline-offset:1px}
  .diag{color:var(--ui-dim);font-size:11px;line-height:1.5;margin-bottom:12px;max-height:84px;overflow:auto;white-space:pre-line}
</style>
</head>
<body>

<div class="stage">
  <div class="wall" id="wall" role="img" aria-label="LED flight display">
    <canvas id="bg"></canvas>
    <canvas id="glow"></canvas>
    <canvas id="lit"></canvas>
    <canvas id="radar"></canvas>
  </div>
</div>

<div class="bar" id="bar">
  <div class="status" id="status"><i></i><span id="statusText">Starting up</span></div>
  <div class="seg" role="group" aria-label="View">
    <button class="btn" data-view="wall">Wall</button><button class="btn" data-view="radar">Radar</button>
  </div>
  <button class="btn" id="locBtn">◎ <b id="locName">Sydney</b></button>
  <button class="btn" id="colBtn"><span class="swatch" id="colSw"></span><span id="colName">White</span></button>
  <button class="btn" id="unitBtn">Speed <b id="unitName">km/h</b></button>
  <button class="btn" id="dimBtn">Brightness <b id="dimName">Auto</b></button>
</div>
<div class="rotate">Rotate your phone for a bigger wall</div>

<div class="sheet-bg" id="sheet">
  <div class="sheet">
    <h2>Where's your window?</h2>
    <p>The wall shows aircraft within range of this spot.</p>
    <button class="btn wide primary" id="geoBtn">Use my location</button>
    <div class="grid" id="cityGrid"></div>
    <div class="lbl">Range</div>
    <div class="row" id="rangeRow" style="margin:8px 0 14px"></div>
    <div class="lbl">Live data relay (only if the status says Demo)</div>
    <input id="relayIn" class="field" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://flightwall-relay.yourname.workers.dev">
    <div class="diag" id="diag"></div>
    <button class="btn wide" id="sheetClose">Done</button>
  </div>
</div>

/* =========================================================
   LED frame buffer
   ========================================================= */
const newBuf = () => new Uint8ClampedArray(COLS*ROWS*3);
function px(b,x,y,c){
  if(x<0||y<0||x>=COLS||y>=ROWS)return;
  const i=(y*COLS+x)*3;b[i]=c[0];b[i+1]=c[1];b[i+2]=c[2];
}
function glyph(b,ch,x,y,c){
  let code = CP437[ch]!==undefined ? CP437[ch] : ch.charCodeAt(0);
  if(code>255) code=63; // '?'
  for(let col=0;col<5;col++){
    const bits=FONT[code*5+col];
    for(let row=0;row<8;row++) if(bits&(1<<row)) px(b,x+col,y+row,c);
  }
}
function text(b,str,x,y,c,maxChars){
  str = String(str||"");
  if(maxChars && str.length>maxChars) str=str.slice(0,maxChars);
  for(let i=0;i<str.length;i++) glyph(b,str[i],x+i*6,y,c);
}
function rect(b,x,y,w,h,c){
  for(let i=x;i<x+w;i++){px(b,i,y,c);px(b,i,y+h-1,c);}
  for(let j=y;j<y+h;j++){px(b,x,j,c);px(b,x+w-1,j,c);}
}

/* =========================================================
   Logos -> LED pixels
   ========================================================= */
function loadLogo(icao){
  if(logoCache[icao]) return logoCache[icao];
  const entry = logoCache[icao] = {state: LOGO_CODES.has(icao) ? "loading" : "none", px:null};
  if(entry.state==="none") return entry;
  const urls = LOGO_URLS(icao);
  const tryUrl = i => {
    if(i>=urls.length){entry.state="none";redrawIfShowing(icao);return;}
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try{
        const c=document.createElement("canvas");c.width=LOGO;c.height=LOGO;
        const x=c.getContext("2d",{willReadFrequently:true});
        x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";
        x.drawImage(img,0,0,LOGO,LOGO);
        entry.px = x.getImageData(0,0,LOGO,LOGO).data;
        entry.state="ok";
      }catch(e){ entry.state="none"; }
      redrawIfShowing(icao);
    };
    img.onerror = () => tryUrl(i+1);
    img.src = urls[i];
  };
  tryUrl(0);
  return entry;
}
/* LEDs read best with hard edges: push contrast and saturation */
function punch(r,g,b){
  const curve=v=>{v/=255;v=v<.5?2*v*v:1-2*(1-v)*(1-v);return v*255;};
  const m=(r+g+b)/3, s=1.35;
  return [curve(m+(r-m)*s),curve(m+(g-m)*s),curve(m+(b-m)*s)];
}
function drawLogo(b,icao,label,x0,y0,c){
  const entry = icao ? loadLogo(icao) : {state:"none"};
  if(entry.state==="ok"){
    const d=entry.px;
    for(let y=0;y<LOGO;y++)for(let x=0;x<LOGO;x++){
      const i=(y*LOGO+x)*4, a=d[i+3]/255;
      if(a<.4) continue;
      const r=d[i]*a,g=d[i+1]*a,bb=d[i+2]*a;
      if(r+g+bb<50) continue;         // near-black stays dark, like a real LED
      px(b,x0+x,y0+y,punch(r,g,bb));
    }
    return;
  }
  // fallback badge: outlined tile with the code
  const dim=c.map(v=>v*.45);
  rect(b,x0,y0,LOGO,LOGO,dim);
  if(entry.state==="loading"){ text(b,"...",x0+7,y0+12,dim); return; }
  const s=(label||"").slice(0,4);
  text(b,s,x0+Math.round((LOGO-s.length*6+1)/2),y0+12,c);
}

/* =========================================================
   Compose a flight card (inspo layout)
   ========================================================= */
function fmtAlt(ft){
  if(!ft&&ft!==0) return "--";
  if(ft<1000) return Math.round(ft)+"ft";
  if(ft<10000) return (ft/1000).toFixed(1)+"kft";
  return Math.round(ft/1000)+"kft";
}
function fmtSpd(kt){
  if(!kt) return "--";
  const u=UNITS[unitI];
  if(u==="kt") return Math.round(kt)+"kt";
  if(u==="mph") return Math.round(kt*1.15078)+"mph";
  return Math.round(kt*1.852)+"kmh";
}
function fmtVs(fpm){
  if(fpm==null) return "--";
  const fps=Math.round(fpm/60);
  return (fps>0?"+":"")+fps+"ft/s";
}

function composeFlight(f){
  const b=newBuf(), c=COLOURS[colI].rgb;
  drawLogo(b,f.airlineIcao,f.badge,1,1,c);
  const X=37, W=15;
  text(b,f.airline,X,3,c,W);
  const rt=routeCache[f.cs];
  const km = f.dist!=null ? f.dist.toFixed(f.dist<10?1:0)+"km" : "";
  let line2;
  if(rt) line2 = `${rt.from}-${rt.to} ${f.cs}`;
  else if(f.airlineIcao) line2 = `${f.cs} ${km}`;
  else line2 = `${km} away`;
  text(b,line2,X,15,c,W);
  text(b,f.typeName||"Unknown type",X,27,c,W);
  text(b,`Alt:${fmtAlt(f.alt)},Spd:${fmtSpd(f.gs)}`,1,40,c,21);
  text(b,`Trk:${f.track!=null?Math.round(f.track):"--"}°,Vr:${fmtVs(f.vs)}`,1,52,c,21);
  return b;
}
function composeMessage(l1,l2,anim){
  const b=newBuf(), c=COLOURS[colI].rgb;
  rect(b,0,0,COLS,ROWS,c);
  const centre=(s,y)=>text(b,s,Math.round((COLS-s.length*6+1)/2),y,c);
  centre(l1, l2?22:28);
  if(l2) centre(l2,34);
  return b;
}

/* =========================================================
   Renderer: dots + glow, with a column wipe between cards
   ========================================================= */
const cBg=$("bg"),cGlow=$("glow"),cLit=$("lit");
const xBg=cBg.getContext("2d"),xGlow=cGlow.getContext("2d"),xLit=cLit.getContext("2d");
let pitch=8, shown=newBuf(), target=newBuf(), wipeStart=0;

function resize(){
  const r=$("wall").getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
  [cBg,cGlow,cLit].forEach(cv=>{cv.width=w;cv.height=h;});
  pitch=w/COLS;
  $("wall").style.setProperty("--glow",(r.width/COLS*0.9).toFixed(1)+"px");
  // unlit LEDs
  xBg.fillStyle="#050506";xBg.fillRect(0,0,w,h);
  xBg.fillStyle="rgba(255,255,255,.055)";
  const rad=pitch*.36;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    xBg.beginPath();xBg.arc((x+.5)*pitch,(y+.5)*pitch,rad,0,6.283);xBg.fill();
  }
  paint(shown);
}
function paint(b){
  const w=cLit.width,h=cLit.height,rad=pitch*.4;
  xLit.clearRect(0,0,w,h);
  let last="";
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const i=(y*COLS+x)*3;
    if(!(b[i]|b[i+1]|b[i+2]))continue;
    const s=`rgb(${b[i]},${b[i+1]},${b[i+2]})`;
    if(s!==last){xLit.fillStyle=s;last=s;}
    xLit.beginPath();xLit.arc((x+.5)*pitch,(y+.5)*pitch,rad,0,6.283);xLit.fill();
  }
  xGlow.clearRect(0,0,w,h);xGlow.drawImage(cLit,0,0);
}
function show(b,instant){
  target=b; gen++;
  if(instant||matchMedia("(prefers-reduced-motion: reduce)").matches){shown=b;paint(b);return;}
  prev=shown; wipeStart=performance.now();
  const my=gen;
  requestAnimationFrame(now=>wipe(now,my));
}
let gen=0, prev=newBuf();
function wipe(now,my){
  if(my!==gen) return;                       // a newer frame took over
  const t=Math.min(1,(now-wipeStart)/420);
  const edge=Math.floor(t*(COLS+6));
  const out=newBuf();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const i=(y*COLS+x)*3;
    const src = x<edge-6 ? target : (x<edge ? null : prev);
    if(src){out[i]=src[i];out[i+1]=src[i+1];out[i+2]=src[i+2];}
  }
  shown = t>=1 ? target : out;
  paint(shown);
  if(t<1) requestAnimationFrame(n=>wipe(n,my));
}

/* =========================================================
   Data: live ADS-B
   The flight networks don't let other websites read them
   directly (no CORS), so requests can go through a relay.
   Order: direct, your own relay (if set), public relays.
   The first path that works is remembered.
   ========================================================= */
let relayUrl = store.get("relay","");
try{ const q=new URLSearchParams(location.search).get("relay"); if(q){ relayUrl=q; store.set("relay",q); } }catch(e){}
function paths(){
  const list=[{name:"direct",wrap:u=>u}];
  // when hosted with its own relay (e.g. Vercel), use it: same address, no CORS issue
  if(/^https?:$/.test(location.protocol) && !/github\.io$/.test(location.hostname))
    list.push({name:"built-in relay",wrap:u=>location.origin+"/api/relay?url="+encodeURIComponent(u),post:true});
  if(relayUrl) list.push({name:"your relay",wrap:u=>relayUrl.replace(/\/?$/,"/")+"?url="+encodeURIComponent(u),post:true});
  list.push(
    {name:"allorigins",wrap:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u+(u.includes("?")?"&":"?")+"_="+Date.now())},
    {name:"codetabs",wrap:u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)},
    {name:"corsproxy",wrap:u=>"https://corsproxy.io/?url="+encodeURIComponent(u),post:true},
  );
  return list;
}
async function getJSON(url,opts={},ms=8000){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(url,{cache:"no-store",...opts,signal:ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }finally{clearTimeout(t);}
}
let lastErrors=[];
function dist(a,b,c,d){
  const R=6371,dLat=toRad(c-a),dLon=toRad(d-b);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
const titleCase = s => s.toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());

function typeName(t,desc){
  if(t && TYPES[t]) return TYPES[t];
  if(desc){
    let d=desc.replace(/^(BOEING|AIRBUS|EMBRAER|BOMBARDIER|DE HAVILLAND CANADA|DE HAVILLAND|ATR|CESSNA|BEECH|PIPER|PILATUS|SAAB|FOKKER|GULFSTREAM AEROSPACE|ROBINSON|EUROCOPTER|AIRBUS HELICOPTERS|BELL|SIKORSKY|LEONARDO|AGUSTAWESTLAND)\s+/i,"");
    d=d.replace(/^A-?(\d)/,"A$1");
    return titleCase(d).replace(/\bMax\b/,"MAX").slice(0,15);
  }
  return t||"";
}
function normalise(a){
  const cs=(a.flight||"").trim().toUpperCase();
  const isAirline=/^[A-Z]{3}\d/.test(cs);
  const icao=isAirline?cs.slice(0,3):"";
  const alt=typeof a.alt_baro==="number"?a.alt_baro:(typeof a.alt_geom==="number"?a.alt_geom:null);
  let airline = icao&&AIRLINES[icao] ? AIRLINES[icao]
              : (a.ownOp ? titleCase(a.ownOp).replace(/\b(Pty|Ltd|Limited|Airways|Airlines|Inc)\b\.?/g,"").replace(/\s+/g," ").trim()
              : (icao||a.r||cs||"Aircraft"));
  return {
    hex:a.hex, cs, reg:a.r||"", airlineIcao:icao, airline:airline.slice(0,15),
    badge: icao || "GA",
    typeName:typeName(a.t,a.desc), alt, gs:a.gs, track:a.track??a.true_heading,
    vs:a.baro_rate??a.geom_rate, lat:a.lat, lon:a.lon,
    dist:dist(loc.lat,loc.lon,a.lat,a.lon),
  };
}

let bestPath = store.get("path", null);   // {src, via}
let failStreak = 0;
function feedUrls(){
  const nm=Math.max(1,Math.round(rangeKm/1.852));
  return {
    "adsb.lol":`https://api.adsb.lol/v2/lat/${loc.lat}/lon/${loc.lon}/dist/${nm}`,
    "airplanes.live":`https://api.airplanes.live/v2/point/${loc.lat}/${loc.lon}/${nm}`,
    "adsb.fi":`https://opendata.adsb.fi/api/v2/lat/${loc.lat}/lon/${loc.lon}/dist/${nm}`,
  };
}
function parseFeed(j){
  const ac=j&&(j.ac||j.aircraft);
  if(!Array.isArray(ac)) throw new Error("unexpected reply");
  return ac.filter(a=>a.lat!=null&&a.lon!=null&&a.alt_baro!=="ground"&&(a.flight||a.r))
    .map(normalise).filter(f=>f.dist<=rangeKm*1.05).sort((x,y)=>x.dist-y.dist);
}
async function fetchLive(){
  const urls=feedUrls(), P=paths();
  // fast path: the combination that worked last time
  if(bestPath){
    const via=P.find(p=>p.name===bestPath.via);
    if(via&&urls[bestPath.src]){
      try{ const list=parseFeed(await getJSON(via.wrap(urls[bestPath.src])));
        sourceName=bestPath.src+(via.name==="direct"?"":" via "+via.name); failStreak=0; return list;
      }catch(e){ if(++failStreak<2) throw e; }
    }
  }
  // discovery: try every combination at once, keep the first that answers
  lastErrors=[];
  const tries=[];
  for(const src of Object.keys(urls)) for(const via of P){
    tries.push(getJSON(via.wrap(urls[src]),{},12000).then(j=>({src,via:via.name,list:parseFeed(j)}))
      .catch(e=>{lastErrors.push(`${src} ${via.name}: ${e.name==="AbortError"?"timed out":(e.message||"blocked")}`);throw e;}));
  }
  const win=await Promise.any(tries);
  bestPath={src:win.src,via:win.via}; store.set("path",bestPath); failStreak=0;
  sourceName=win.src+(win.via==="direct"?"":" via "+win.via);
  return win.list;
}

/* routes: adsbdb.com (free, per callsign), cached */
async function fetchRoutes(list){
  const need=list.filter(f=>/^[A-Z]{3}\d/.test(f.cs)&&!(f.cs in routeCache)).slice(0,6);
  if(!need.length) return;
  const P=paths().filter(p=>p.name==="direct"||p.name===bestPath?.via||p.name==="your relay");
  await Promise.all(need.map(async f=>{
    routeCache[f.cs]=null;
    const u=`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(f.cs)}`;
    for(const via of P){
      try{
        const j=await getJSON(via.wrap(u),{},7000);
        const r=j&&j.response&&j.response.flightroute;
        if(r&&r.origin&&r.destination){
          routeCache[f.cs]={from:r.origin.iata_code||r.origin.icao_code,to:r.destination.iata_code||r.destination.icao_code};
        }
        return;
      }catch(e){}
    }
  }));
}

let busy=false, lastDiscovery=0;
async function refresh(){
  if(busy) return;
  // while stuck on demo, look for a working path once a minute, not every refresh
  if(mode==="demo" && !bestPath && Date.now()-lastDiscovery<60000) return;
  if(!bestPath) lastDiscovery=Date.now();
  busy=true;
  try{
    const list=await fetchLive();
    flights=list; mode=list.length?"live":"empty"; lastUpdate=new Date();
    recordTrails(list);
    fetchRoutes(list).then(()=>{ if(current()) redraw(true); });
  }catch(e){
    if(mode!=="live"){ flights=demoFlights(); mode="demo"; }
  }finally{ busy=false; }
  updateStatus();
  if(!current()) curHex = flights[0]?.hex || null;
  redraw();
}

/* =========================================================
   Cycling + drawing
   ========================================================= */
const current = () => flights.find(f=>f.hex===curHex);
let lastKey="";
function redraw(instant){
  let b, key;
  if(mode==="loading"){ b=composeMessage("...",""); key="loading"; }
  else if(!flights.length){ b=composeMessage("NO FLIGHTS",`IN ${rangeKm}KM`); key="empty"; }
  else { const f=current()||flights[0]; curHex=f.hex; b=composeFlight(f); key=f.hex; }
  const changed = key!==lastKey; lastKey=key;
  show(b, instant || !changed);
}
function redrawIfShowing(icao){ const f=current(); if(f&&f.airlineIcao===icao) redraw(true); }
let cycleT;
function next(){
  clearTimeout(cycleT); cycleT=setTimeout(next,CYCLE_MS);
  if(flights.length<2) return;
  const i=flights.findIndex(f=>f.hex===curHex);
  curHex=flights[(i+1)%flights.length].hex;
  redraw();
}
cycleT=setTimeout(next,CYCLE_MS);

/* =========================================================
   Radar view
   Your spot in the centre, range rings, a rotating sweep.
   Blips move smoothly between data refreshes (dead reckoning),
   point along their track, and glow as the sweep passes.
   Right panel: the selected flight (same one as the wall).
   ========================================================= */
const cR=$("radar"), xR=cR.getContext("2d");
const RG=[61,220,132], SEL=[255,176,33];
const trails={};             // hex -> [[lat,lon],...]
let blipHits=[], radarRAF=0;
const logoCanv={};

function recordTrails(list){
  const seen=new Set();
  list.forEach(f=>{ seen.add(f.hex); (trails[f.hex]=trails[f.hex]||[]).push([f.lat,f.lon]); if(trails[f.hex].length>8) trails[f.hex].shift(); });
  Object.keys(trails).forEach(h=>{ if(!seen.has(h)) delete trails[h]; });
}
function bearing(a,b,c,d){
  const y=Math.sin(toRad(d-b))*Math.cos(toRad(c));
  const x=Math.cos(toRad(a))*Math.sin(toRad(c))-Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(toRad(d-b));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
const COMPASS=["N","NE","E","SE","S","SW","W","NW"];
// where the aircraft is now, projected forward from its last report
function nowPos(f){
  let lat=f.lat, lon=f.lon;
  if(mode==="live" && lastUpdate && f.gs && f.track!=null){
    const hrs=Math.max(0,Math.min((Date.now()-lastUpdate.getTime())/3.6e6, 45/3600));
    const dR=f.gs*1.852*hrs/6371, th=toRad(f.track), p1=toRad(lat), l1=toRad(lon);
    const p2=Math.asin(Math.sin(p1)*Math.cos(dR)+Math.cos(p1)*Math.sin(dR)*Math.cos(th));
    const l2=l1+Math.atan2(Math.sin(th)*Math.sin(dR)*Math.cos(p1),Math.cos(dR)-Math.sin(p1)*Math.sin(p2));
    lat=p2*180/Math.PI; lon=l2*180/Math.PI;
  }
  return {lat,lon,d:dist(loc.lat,loc.lon,lat,lon),b:bearing(loc.lat,loc.lon,lat,lon)};
}
function sizeRadar(){
  const r=$("wall").getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  cR.width=Math.round(r.width*dpr); cR.height=Math.round(r.height*dpr);
}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function logoCanvas(icao){
  const e=icao&&logoCache[icao];
  if(!e||e.state!=="ok") { if(icao) loadLogo(icao); return null; }
  if(logoCanv[icao]) return logoCanv[icao];
  const c=document.createElement("canvas");c.width=LOGO;c.height=LOGO;
  const id=new ImageData(new Uint8ClampedArray(e.px),LOGO,LOGO);c.getContext("2d").putImageData(id,0,0);
  return logoCanv[icao]=c;
}

function drawRadar(now){
  const W=cR.width,H=cR.height; if(!W) return;
  const u=H/100;                                 // layout unit
  const cx=H/2, cy=H/2, R=H*0.44;
  const sweep=(now/4000*360)%360;
  xR.setTransform(1,0,0,1,0,0);
  xR.fillStyle="#040605";xR.fillRect(0,0,W,H);

  // scope
  const g=xR.createRadialGradient(cx,cy,0,cx,cy,R);
  g.addColorStop(0,"rgba(61,220,132,.07)");g.addColorStop(1,"rgba(61,220,132,.015)");
  xR.fillStyle=g;xR.beginPath();xR.arc(cx,cy,R,0,6.283);xR.fill();
  xR.strokeStyle=rgba(RG,.22);xR.lineWidth=Math.max(1,u*.18);
  for(let i=1;i<=3;i++){xR.beginPath();xR.arc(cx,cy,R*i/3,0,6.283);xR.stroke();}
  xR.beginPath();xR.moveTo(cx-R,cy);xR.lineTo(cx+R,cy);xR.moveTo(cx,cy-R);xR.lineTo(cx,cy+R);xR.stroke();
  // ticks every 10 degrees
  for(let a=0;a<360;a+=10){const r1=R*(a%30?0.975:0.95),t=toRad(a-90);
    xR.beginPath();xR.moveTo(cx+Math.cos(t)*r1,cy+Math.sin(t)*r1);xR.lineTo(cx+Math.cos(t)*R,cy+Math.sin(t)*R);xR.stroke();}
  xR.font=`600 ${u*3}px ui-monospace,Menlo,monospace`;xR.textAlign="center";xR.textBaseline="middle";
  xR.fillStyle=rgba(RG,.7);
  [["N",0],["E",90],["S",180],["W",270]].forEach(([s,a])=>{const t=toRad(a-90);xR.fillText(s,cx+Math.cos(t)*(R+u*3.2),cy+Math.sin(t)*(R+u*3.2));});
  xR.textAlign="left";xR.fillStyle=rgba(RG,.45);xR.font=`500 ${u*2.4}px ui-monospace,Menlo,monospace`;
  for(let i=1;i<=3;i++) xR.fillText(Math.round(rangeKm*i/3)+"km",cx+u*.8,cy-R*i/3+u*1.8);

  // sweep wedge
  if(xR.createConicGradient){
    const cg=xR.createConicGradient(toRad(sweep-90-60),cx,cy);
    cg.addColorStop(0,"rgba(61,220,132,0)");cg.addColorStop(60/360,"rgba(61,220,132,.28)");cg.addColorStop(60/360+.001,"rgba(61,220,132,0)");
    xR.fillStyle=cg;xR.beginPath();xR.arc(cx,cy,R,0,6.283);xR.fill();
  }
  const st=toRad(sweep-90);
  xR.strokeStyle=rgba(RG,.8);xR.lineWidth=u*.3;xR.beginPath();xR.moveTo(cx,cy);xR.lineTo(cx+Math.cos(st)*R,cy+Math.sin(st)*R);xR.stroke();

  // blips
  blipHits=[];
  const toXY=(d,b)=>{const r=Math.min(d/rangeKm,1.04)*R,t=toRad(b-90);return [cx+Math.cos(t)*r,cy+Math.sin(t)*r];};
  flights.forEach(f=>{
    const p=nowPos(f); if(p.d>rangeKm*1.05) return;
    const [x,y]=toXY(p.d,p.b), sel=f.hex===curHex, col=sel?SEL:RG;
    const since=((sweep-p.b)%360+360)%360, glow=0.35+0.65*Math.max(0,1-since/300);
    // trail
    const tr=trails[f.hex]||[];
    tr.forEach((q,i)=>{const [tx,ty]=toXY(dist(loc.lat,loc.lon,q[0],q[1]),bearing(loc.lat,loc.lon,q[0],q[1]));
      xR.fillStyle=rgba(col,.12+.25*i/tr.length);xR.beginPath();xR.arc(tx,ty,u*.45,0,6.283);xR.fill();});
    // plane arrow along track
    xR.save();xR.translate(x,y);xR.rotate(toRad(f.track||0));
    xR.shadowColor=rgba(col,1);xR.shadowBlur=u*2*glow;xR.fillStyle=rgba(col,glow);
    const s=u*(sel?1.9:1.4);
    xR.beginPath();xR.moveTo(0,-s*1.4);xR.lineTo(s,s);xR.lineTo(0,s*.45);xR.lineTo(-s,s);xR.closePath();xR.fill();
    xR.restore();xR.shadowBlur=0;
    if(sel){xR.strokeStyle=rgba(SEL,.9);xR.lineWidth=u*.25;xR.beginPath();xR.arc(x,y,u*3.4,0,6.283);xR.stroke();}
    // label
    xR.font=`${sel?700:500} ${u*(sel?2.8:2.3)}px ui-monospace,Menlo,monospace`;xR.textAlign="left";
    xR.fillStyle=sel?rgba(SEL,1):rgba([220,255,230],.55+.4*glow);
    const lx=x+u*(sel?4.4:2.6);
    xR.fillText(f.cs||f.reg||"",lx,y-u*1.2);
    if(sel){xR.font=`500 ${u*2.3}px ui-monospace,Menlo,monospace`;xR.fillStyle=rgba(SEL,.8);xR.fillText(fmtAlt(f.alt),lx,y+u*2);}
    blipHits.push({hex:f.hex,x,y});
  });
  // you
  xR.fillStyle="#fff";xR.beginPath();xR.arc(cx,cy,u*.8,0,6.283);xR.fill();

  // ---------- side panel ----------
  const px0=H*1.0+u*2, pw=W-px0-u*4;
  xR.strokeStyle="rgba(255,255,255,.07)";xR.lineWidth=1;xR.beginPath();xR.moveTo(H,u*6);xR.lineTo(H,H-u*6);xR.stroke();
  const f=current()||flights[0];
  xR.textAlign="left";xR.textBaseline="alphabetic";
  const label=(s,y)=>{xR.font=`500 ${u*2.3}px ui-monospace,Menlo,monospace`;xR.fillStyle=rgba(RG,.6);xR.fillText(s.toUpperCase(),px0,y);};
  if(!f){
    xR.font=`600 ${u*4}px ui-monospace,Menlo,monospace`;xR.fillStyle="#ddd";
    xR.fillText(mode==="loading"?"Scanning…":"No aircraft",px0,H*.45);
    xR.font=`500 ${u*2.6}px ui-monospace,Menlo,monospace`;xR.fillStyle="#777";
    xR.fillText(mode==="loading"?"":`within ${rangeKm} km of ${loc.name}`,px0,H*.45+u*5);
    return;
  }
  const p=nowPos(f), rt=routeCache[f.cs];
  const lc=logoCanvas(f.airlineIcao), ls=u*14;
  let y=u*9;
  if(lc){xR.imageSmoothingEnabled=false;xR.drawImage(lc,px0,y,ls,ls);}
  else{xR.strokeStyle="rgba(255,255,255,.2)";xR.strokeRect(px0,y,ls,ls);xR.font=`700 ${u*3}px ui-monospace,Menlo,monospace`;xR.fillStyle="#bbb";xR.textAlign="center";xR.fillText(f.badge,px0+ls/2,y+ls/2+u);xR.textAlign="left";}
  const tx=px0+ls+u*3;
  xR.font=`700 ${u*5}px ui-monospace,Menlo,monospace`;xR.fillStyle="#fff";xR.fillText(f.airline,tx,y+u*5.5);
  xR.font=`600 ${u*3.4}px ui-monospace,Menlo,monospace`;xR.fillStyle=rgba(SEL,1);xR.fillText(f.cs||f.reg,tx,y+u*10);
  xR.font=`500 ${u*2.8}px ui-monospace,Menlo,monospace`;xR.fillStyle="#9aa";xR.fillText(f.typeName||"",tx,y+u*14);
  y+=ls+u*8;
  if(rt){xR.font=`700 ${u*7}px ui-monospace,Menlo,monospace`;xR.fillStyle="#fff";xR.fillText(`${rt.from} → ${rt.to}`,px0,y);y+=u*8;}
  const stats=[["Altitude",fmtAlt(f.alt)],["Speed",fmtSpd(f.gs)],["Distance",p.d.toFixed(1)+"km "+COMPASS[Math.round(p.b/45)%8]],["Heading",(f.track!=null?Math.round(f.track):"--")+"°"]];
  const cw=pw/2;
  stats.forEach((s,i)=>{const sx=px0+(i%2)*cw, sy=y+Math.floor(i/2)*u*11;
    xR.font=`500 ${u*2.3}px ui-monospace,Menlo,monospace`;xR.fillStyle=rgba(RG,.6);xR.fillText(s[0].toUpperCase(),sx,sy);
    xR.font=`600 ${u*4.4}px ui-monospace,Menlo,monospace`;xR.fillStyle="#eee";xR.fillText(s[1],sx,sy+u*5.5);});
  y+=u*24;
  // other aircraft
  label(`${flights.length} in range · tap a blip`,y);
  xR.font=`500 ${u*2.6}px ui-monospace,Menlo,monospace`;
  flights.filter(o=>o.hex!==f.hex).slice(0,4).forEach((o,i)=>{
    const q=nowPos(o);xR.fillStyle="#8a9";
    xR.fillText(`${(o.cs||o.reg).padEnd(8)} ${q.d.toFixed(0).padStart(3)}km ${fmtAlt(o.alt)}`,px0,y+u*4.2*(i+1));
  });
}
function radarLoop(now){
  radarRAF=0;
  if(view!=="radar"||document.hidden) return;
  drawRadar(now);
  radarRAF=requestAnimationFrame(radarLoop);
}
let view=store.get("view","wall");
function setView(v){
  view=v; store.set("view",v);
  $("wall").classList.toggle("radar",v==="radar");
  $("wall").setAttribute("aria-label", v==="radar"?"Radar of aircraft around you":"LED flight display");
  document.querySelectorAll(".seg .btn").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  if(v==="radar"){ sizeRadar(); if(!radarRAF) radarRAF=requestAnimationFrame(radarLoop); }
  else { resize(); }
}
document.querySelectorAll(".seg .btn").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&view==="radar"&&!radarRAF) radarRAF=requestAnimationFrame(radarLoop); });

/* =========================================================
   Status + controls
   ========================================================= */
function updateStatus(){
  const s=$("status"), t=$("statusText");
  s.className="status "+(mode==="live"||mode==="empty"?"live":mode==="demo"?"demo":"");
  if(mode==="demo") t.textContent="Demo data · live feed blocked · tap ◎ to add a relay";
  else if(mode==="loading") t.textContent="Connecting to live ADS-B";
  else {
    const hh=lastUpdate.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit",second:"2-digit"});
    t.textContent=`Live · ${flights.length} aircraft · ${rangeKm} km · ${hh}`;
    t.title=sourceName;
  }
}
function applyDim(){
  let level=DIMS[dimI];
  if(level==="Auto"){const h=new Date().getHours();level=(h>=19||h<6)?"Low":"High";}
  $("wall").style.filter = level==="Low" ? "brightness(.72)" : "none";
  $("dimName").textContent=DIMS[dimI];
}
function syncControls(){
  $("locName").textContent=loc.name;
  $("colName").textContent=COLOURS[colI].name;
  $("colSw").style.background=`rgb(${COLOURS[colI].rgb})`;
  $("unitName").textContent=UNITS[unitI];
  applyDim();
}
$("colBtn").onclick=()=>{colI=(colI+1)%COLOURS.length;store.set("col",colI);syncControls();redraw(true);};
$("unitBtn").onclick=()=>{unitI=(unitI+1)%UNITS.length;store.set("unit",unitI);syncControls();redraw(true);};
$("dimBtn").onclick=()=>{dimI=(dimI+1)%DIMS.length;store.set("dim",dimI);applyDim();};
$("locBtn").onclick=()=>{
  $("relayIn").value=relayUrl;
  $("diag").textContent = mode==="demo" && lastErrors.length ? "Last check:\n"+lastErrors.slice(0,8).join("\n") : (mode==="live"?"Connected: "+sourceName:"");
  $("sheet").classList.add("on");
};
$("sheetClose").onclick=()=>{
  const v=$("relayIn").value.trim();
  $("sheet").classList.remove("on");
  if(v!==relayUrl){ relayUrl=v; store.set("relay",v); bestPath=null; store.set("path",null); restart(); }
};
$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("on");};

function buildSheet(){
  const g=$("cityGrid");g.innerHTML="";
  let region="";
  CITIES.forEach(c=>{
    if(c.region!==region){
      region=c.region;
      const h=document.createElement("div");h.className="region";h.textContent=region;g.appendChild(h);
    }
    const b=document.createElement("button");b.className="btn"+(c.name===loc.name?" sel":"");b.textContent=c.name;
    b.onclick=()=>setLoc(c);g.appendChild(b);
  });
  const r=$("rangeRow");r.innerHTML="";
  RANGES.forEach(km=>{
    const b=document.createElement("button");b.className="btn"+(km===rangeKm?" primary":"");b.textContent=km+" km";
    b.onclick=()=>{rangeKm=km;store.set("range",km);buildSheet();restart();};r.appendChild(b);
  });
}
function setLoc(c){loc=c;store.set("loc",c);syncControls();buildSheet();$("sheet").classList.remove("on");restart();}
function restart(){mode="loading";flights=[];curHex=null;updateStatus();redraw();refresh();}
$("geoBtn").onclick=()=>{
  const btn=$("geoBtn");
  if(!navigator.geolocation){btn.textContent="Location not available here";return;}
  btn.textContent="Finding you…";
  navigator.geolocation.getCurrentPosition(
    p=>{btn.textContent="Use my location";setLoc({name:"My spot",lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)});},
    ()=>{btn.textContent="Location blocked · pick a city";},
    {timeout:10000}
  );
};

/* tap the wall to skip; controls fade when idle */
$("wall").onclick=e=>{
  wake();
  if(view==="radar"){
    const r=cR.getBoundingClientRect(), k=cR.width/r.width, x=(e.clientX-r.left)*k, y=(e.clientY-r.top)*k;
    let best=null,bd=(cR.height*0.08)**2;
    blipHits.forEach(h=>{const d=(h.x-x)**2+(h.y-y)**2; if(d<bd){bd=d;best=h;}});
    if(best){ curHex=best.hex; clearTimeout(cycleT); cycleT=setTimeout(next,CYCLE_MS*2); redraw(true); return; }
  }
  next();
};
let idleT;
function poke(){document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>{if(!$("sheet").classList.contains("on"))document.body.classList.add("idle");},6000);}
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,poke));

/* keep the screen awake while the wall is showing */
let lock=null;
async function wake(){
  try{ if("wakeLock" in navigator && !lock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>lock=null); } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});
addEventListener("pointerdown",wake,{once:true});

/* =========================================================
   Boot
   ========================================================= */
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{resize();if(view==="radar")sizeRadar();},120);});
syncControls();buildSheet();updateStatus();setView(view);
resize();redraw(true);
refresh();
setInterval(refresh,REFRESH_MS);
setInterval(applyDim,60000);
poke();
</script>
</body>
</html>
